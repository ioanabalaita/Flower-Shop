<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Favorites - Peony Flower Shop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div class="container">
    <div class="header-actions">
        <h1>My Favorites</h1>
        <a th:href="@{/shop}" class="btn">Back to Catalog</a>
    </div>

    <div th:if="${#lists.isEmpty(favorites)}" style="text-align: center; padding: 40px; color: #777;">
        <p>You have no favorite flowers yet.</p>
        <a th:href="@{/shop}" class="btn" style="margin-top: 10px; display: inline-block;">Explore Catalog</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px;">
        <div th:each="fav : ${favorites}" style="background: #fffafb; border: 1px solid #f0cdd6; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;">
            <img th:src="${fav.flower.imageUrl != null && !fav.flower.imageUrl.isBlank()} ? ${fav.flower.imageUrl} : @{/images/peonies.jpg}"
                 alt="Flower image"
                 style="width: 100%; height: 200px; object-fit: cover;">

            <div style="padding: 18px; display: flex; flex-direction: column; flex-grow: 1;">
                <span th:text="${fav.flower.category}" style="font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; color: #c97a8e; margin-bottom: 5px;"></span>
                <h3 th:text="${fav.flower.name}" style="margin: 0 0 8px 0;"></h3>
                <p th:text="${fav.flower.price + ' RON'}" style="font-weight: 600; color: #333; margin: 0 0 15px 0;"></p>

                <div style="margin-top: auto; display: flex; gap: 10px;">
                    <a th:href="@{/shop/{id}(id=${fav.flower.id})}" class="btn" style="flex: 1; text-align: center;">Details</a>
                    <form th:action="@{/favorites/toggle/{id}(id=${fav.flower.id}, from='favorites')}" method="post" style="margin: 0;">
                        <button type="submit" class="btn" style="background-color: #d32f2f;">Remove</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
