<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error - Peony Flower Shop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div class="container" style="text-align: center; padding: 60px 20px;">
    <h1 th:text="${errorTitle}" style="color: #c97a8e;">Oops! Something went wrong</h1>
    <p th:text="${errorMessage}" style="color: #555; font-size: 1.1em; margin: 20px 0 30px 0;"></p>
    <a th:href="@{/}" class="btn">Back to Home</a>
</div>
</body>
</html>
