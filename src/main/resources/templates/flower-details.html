<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${flower.name} + ' - Peony Flower Shop'">Flower Details</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h1 th:text="${flower.name}">Flower Name</h1>
            <a th:href="@{/shop}" class="btn">Back to Catalog</a>
        </div>

        <div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start;">
            <div style="flex: 1; min-width: 280px;">
                <img th:src="${flower.imageUrl != null && !flower.imageUrl.isBlank()} ? ${flower.imageUrl} : @{/images/peonies.jpg}"
                     alt="Flower image"
                     style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; border: 1px solid #f0cdd6;">
            </div>

            <div style="flex: 1; min-width: 280px;">
                <p style="font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: #c97a8e;" th:text="${flower.category}"></p>
                <h2 th:text="${flower.price + ' RON'}" style="font-size: 1.8em; margin-top: 5px;"></h2>

                <p th:text="${flower.stockQuantity > 0} ? 'Available in stock: ' + ${flower.stockQuantity} : 'Currently out of stock'"
                   th:style="${flower.stockQuantity > 0} ? 'color: #2e7d32; font-weight: 500;' : 'color: #c62828; font-weight: 500;'"></p>

                <hr style="border: none; border-top: 1px solid #fae6ec; margin: 20px 0;">

                <h3>Description</h3>
                <p th:text="${flower.description != null && !flower.description.isBlank()} ? ${flower.description} : 'No description provided.'" style="line-height: 1.6; color: #555;"></p>

                <div style="margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap;">
                    <form th:action="@{/favorites/toggle/{id}(id=${flower.id}, from='details')}" method="post" style="margin: 0;">
                        <button type="submit" class="btn"
                                th:style="${isFavorite} ? 'background-color: #d32f2f;' : 'background-color: #f0cdd6; color: #333;'"
                                th:text="${isFavorite} ? '♥ Remove from Favorites' : '♡ Add to Favorites'">
                        </button>
                    </form>
                    <form th:if="${flower.stockQuantity > 0}" th:action="@{/cart/add/{id}(id=${flower.id})}" method="post" style="display: flex; gap: 10px; align-items: center; margin: 0;">
                        <input type="number" name="quantity" value="1" min="1" th:max="${flower.stockQuantity}"
                               style="width: 70px; padding: 9px; border: 1px solid #f0cdd6; border-radius: 4px;">
                        <button type="submit" class="btn">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
