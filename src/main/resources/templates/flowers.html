<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Management</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body>
<div class="container">

    <div class="header-actions">
        <h1>Shop Inventory</h1>
        <a th:href="@{/}" class="btn btn-outline">Back to Home</a>
    </div>

    <h2>Add a New Flower</h2>
    <form th:action="@{/flowers/add}" th:object="${newFlower}" method="post" class="form-group">
        <div>
            <label>Name:</label> <br>
            <input type="text" th:field="*{name}" required style="width: 100%; box-sizing: border-box;" />
        </div>

        <div>
            <label>Price:</label> <br>
            <input type="number" step="0.01" min="0" th:field="*{price}" required style="width: 100%; box-sizing: border-box;" />
        </div>

        <div>
            <label>Category:</label> <br>
            <select th:field="*{category}" required style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #f0cdd6; border-radius: 4px; background-color: #fffafb; font-family: inherit;">
                <option value="" disabled selected>-- Select a category --</option>
                <option value="Single Stem">Single Stem</option>
                <option value="Bouquet">Bouquet</option>
                <option value="Floral Arrangement">Floral Arrangement</option>
            </select>
        </div>

        <div>
            <label>Stock Quantity:</label> <br>
            <input type="number" min="0" th:field="*{stockQuantity}" required style="width: 100%; box-sizing: border-box;" />
        </div>

        <div style="grid-column: 1 / -1;">
            <label>Image URL (optional, e.g. /images/peonies.jpg):</label> <br>
            <input type="text" th:field="*{imageUrl}" placeholder="/images/peonies.jpg" style="width: 100%; box-sizing: border-box;" />
        </div>

        <div style="grid-column: 1 / -1;">
            <label>Description:</label> <br>
            <input type="text" th:field="*{description}" style="width: 100%; box-sizing: border-box;" />
        </div>

        <div style="grid-column: 1 / -1;">
            <button type="submit" class="btn">Add to Stock</button>
        </div>
    </form>

    <h2>Current Inventory</h2>
    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="flower : ${flowersList}">
                <td th:text="${flower.id}"></td>
                <td th:text="${flower.name}"></td>
                <td th:text="${flower.price}"></td>
                <td th:text="${flower.category}"></td>
                <td th:text="${flower.stockQuantity}"></td>
                <td th:text="${flower.description}"></td>
                <td>
                    <a th:href="@{/flowers/edit/{id}(id=${flower.id})}" style="color: #1976d2; text-decoration: none; margin-right: 15px; font-weight: bold;">Edit</a>
                    <a th:href="@{/flowers/delete/{id}(id=${flower.id})}" style="color: #d32f2f; text-decoration: none; font-weight: bold;">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
