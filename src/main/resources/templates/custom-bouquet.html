<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Bouquet Builder - Peony Flower Shop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h1>Build Your Custom Bouquet</h1>
            <a th:href="@{/shop}" class="btn">Back to Catalog</a>
        </div>

        <div th:if="${param.error}" style="background-color: #fdecea; color: #c62828; padding: 12px; border-radius: 6px; margin-bottom: 20px;">
            Please select at least one flower stem to create your bouquet.
        </div>

        <div th:if="${#lists.isEmpty(singleStems)}" style="text-align: center; padding: 40px; color: #777;">
            <p>No single stem flowers are currently available. Please check back later.</p>
        </div>

        <form th:if="${!#lists.isEmpty(singleStems)}" th:action="@{/custom-bouquet/add}" method="post">
            <h2>1. Choose Your Stems</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div th:each="flower : ${singleStems}" style="background: #fffafb; border: 1px solid #f0cdd6; border-radius: 8px; padding: 15px; display: flex; flex-direction: column;">
                    <img th:src="${flower.imageUrl != null && !flower.imageUrl.isBlank()} ? ${flower.imageUrl} : @{/images/peonies.jpg}"
                         alt="Flower"
                         style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px;">
                    <h3 th:text="${flower.name}" style="margin: 0 0 5px 0;"></h3>
                    <p th:text="${flower.price + ' RON / stem'}" style="color: #c97a8e; font-weight: 600; margin: 0 0 10px 0;"></p>

                    <div style="margin-top: auto;">
                        <label>Quantity:</label>
                        <input type="number"
                               th:name="'qty_' + ${flower.id}"
                               value="0"
                               min="0"
                               th:max="${flower.stockQuantity}"
                               th:attr="data-price=${flower.price}"
                               class="stem-input"
                               oninput="calculateTotal()"
                               style="width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #f0cdd6; border-radius: 4px;">
                    </div>
                </div>
            </div>

            <h2>2. Wrapping & Personal Touch</h2>
            <div style="background: #fffafb; border: 1px solid #f0cdd6; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px;">
                <div>
                    <label>Wrapping Style:</label><br>
                    <select name="wrapping" id="wrappingSelect" onchange="calculateTotal()"
                            style="width: 100%; padding: 10px; border: 1px solid #f0cdd6; border-radius: 4px; background: white;">
                        <option value="Kraft Paper" data-price="5">Kraft Paper (+5 RON)</option>
                        <option value="Pastel Pink Paper" data-price="10">Pastel Pink Paper (+10 RON)</option>
                        <option value="Luxury Gift Box" data-price="25">Luxury Gift Box (+25 RON)</option>
                    </select>
                </div>

                <div>
                    <label>Ribbon Color:</label><br>
                    <select name="ribbon"
                            style="width: 100%; padding: 10px; border: 1px solid #f0cdd6; border-radius: 4px; background: white;">
                        <option value="Satin Pink">Satin Pink</option>
                        <option value="White Silk">White Silk</option>
                        <option value="Champagne Gold">Champagne Gold</option>
                        <option value="Deep Red">Deep Red</option>
                    </select>
                </div>

                <div style="grid-column: 1 / -1;">
                    <label>Gift Card Message (optional):</label><br>
                    <input type="text" name="cardMessage" placeholder="Write a sweet note..."
                           style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #f0cdd6; border-radius: 4px;">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; padding: 20px; background: #fae6ec; border-radius: 8px;">
                <h2 style="margin: 0;">Estimated Total: <span id="totalDisplay">5.00</span> RON</h2>
                <button type="submit" class="btn">Add Custom Bouquet to Cart</button>
            </div>
        </form>
    </div>

    <script>
        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.stem-input').forEach(input => {
                const qty = parseInt(input.value) || 0;
                const price = parseFloat(input.getAttribute('data-price')) || 0;
                total += qty * price;
            });

            const wrappingSelect = document.getElementById('wrappingSelect');
            const selectedOption = wrappingSelect.options[wrappingSelect.selectedIndex];
            total += parseFloat(selectedOption.getAttribute('data-price')) || 0;

            document.getElementById('totalDisplay').textContent = total.toFixed(2);
        }
    </script>
</body>
</html>
