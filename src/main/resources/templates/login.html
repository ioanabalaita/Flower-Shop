<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Flower Shop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-split-card">

        <div class="auth-image-side"></div>

        <div class="auth-form-side">
            <h1>Sign In</h1>

            <div th:if="${param.error}" style="color: red; text-align: center; margin-bottom: 10px; font-size: 0.9em;">
                Invalid username or password!
            </div>
            <div th:if="${param.logout}" style="color: green; text-align: center; margin-bottom: 10px; font-size: 0.9em;">
                You have been logged out successfully.
            </div>
            <div th:if="${param.success}" style="color: green; text-align: center; margin-bottom: 10px; font-size: 0.9em;">
                Account created! You can now sign in.
            </div>

            <form th:action="@{/login}" method="post">
                <label>Username:</label>
                <input type="text" name="username" required autocomplete="off" />

                <label>Password:</label>
                <input type="password" name="password" required />

                <button type="submit" class="btn-solid">SIGN IN</button>
            </form>

            <hr>

            <div style="text-align: center;">
                <p style="margin-bottom: 10px; font-size: 0.9em; color: #555;">Don't have an account?</p>
                <a th:href="@{/register}" class="btn-outline">SIGN UP HERE</a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
